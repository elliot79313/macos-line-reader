[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-mac-reader"
version = "0.1.0"
description = "Read unread LINE messages on macOS desktop via UI automation + OCR"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pytesseract>=0.3.10",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
line-mac-reader = "line_mac_reader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
